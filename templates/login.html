{% extends "base.html" %}
{% block title %}Log in — ResuMatch{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Log in</h2>
        <p class="sub">Welcome back. Enter your details to continue.</p>

        <form method="POST" action="{{ url_for('login') }}" novalidate id="loginForm">
            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-accent w-100 mt-2">Log in</button>
        </form>

        <p class="text-center mt-4 mb-0" style="color: var(--ink-soft); font-size: 0.9rem;">
            Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
        </p>
    </div>
</div>
{% endblock %}
