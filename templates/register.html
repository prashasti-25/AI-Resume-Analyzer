{% extends "base.html" %}
{% block title %}Create account — ResuMatch{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Create your account</h2>
        <p class="sub">Start matching your resume against real job descriptions.</p>

        <form method="POST" action="{{ url_for('register') }}" novalidate id="registerForm">
            <div class="mb-3">
                <label class="form-label" for="name">Full name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm_password">Confirm password</label>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="6" required>
            </div>
            <div id="passwordMismatch" class="text-danger mb-3" style="font-size: 0.85rem; display: none;">
                Passwords do not match.
            </div>
            <button type="submit" class="btn btn-accent w-100 mt-2">Create account</button>
        </form>

        <p class="text-center mt-4 mb-0" style="color: var(--ink-soft); font-size: 0.9rem;">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
